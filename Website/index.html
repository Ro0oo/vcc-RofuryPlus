<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoFury+ · Add to VCC</title>
  <link rel="icon" href="./favicon.ico">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #141414;
      --fg: #f2f2f2;
      --muted: #9a9a9a;
      --orange: #ff8a1e;
      --orange-hi: #ffa24a;
      --box: rgba(255, 255, 255, 0.07);
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f4f4f4; --fg: #1c1c1c; --muted: #666; --box: rgba(0, 0, 0, 0.06); }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(ellipse at top, rgba(255, 138, 30, 0.12), transparent 60%), var(--bg);
      color: var(--fg);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
    }

    .wrap {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .logo {
      width: 420px;
      max-width: 90%;
      height: auto;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.35));
    }

    .addBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 380px;
      padding: 22px 32px;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--orange-hi), var(--orange));
      color: #fff;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(255, 138, 30, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    }
    .addBtn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 14px 38px rgba(255, 138, 30, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    .addBtn:active { transform: translateY(1px); }
    .addBtn .plus { font-size: 2rem; line-height: 1; margin-top: -3px; }

    .manual {
      font-size: 0.85rem;
      color: var(--muted);
      width: 100%;
    }
    .urlRow {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .urlRow code {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--box);
      color: var(--fg);
      font-family: Consolas, 'Courier New', monospace;
      font-size: 0.85rem;
      text-align: left;
      word-break: break-all;
      user-select: all;
    }
    .copyBtn {
      padding: 0 14px;
      border: none;
      border-radius: 8px;
      background: var(--box);
      color: var(--fg);
      font: inherit;
      cursor: pointer;
    }
    .copyBtn:hover { filter: brightness(1.3); }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="https://raw.githubusercontent.com/ro0oo/vcc-RofuryPlus/main/Assets/RoFury%2B%20small.png" alt="RoFury+" />

    <a class="addBtn" href="vcc://vpm/addRepo?url=https://ro0oo.github.io/vcc-RofuryPlus/index.json">
      <span class="plus">+</span> Add to VCC
    </a>

    <div class="manual">
      Button not working? Add this URL in VCC → Settings → Packages → Add Repository:
      <div class="urlRow">
        <code id="listingUrl">https://ro0oo.github.io/vcc-RofuryPlus/index.json</code>
        <button class="copyBtn" id="copyBtn" type="button">Copy</button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('copyBtn').addEventListener('click', function () {
      var btn = this;
      navigator.clipboard.writeText(document.getElementById('listingUrl').textContent).then(function () {
        btn.textContent = 'Copied!';
        setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
      });
    });
  </script>
</body>
</html>
